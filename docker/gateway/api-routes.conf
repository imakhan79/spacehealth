# Supabase API routes, shared by the LAN (8443) and internal (8000) servers.
# Expects $omni_key_ok, $omni_apikey and $omni_authorization to be set by the
# enclosing server block. Paths match what supabase-js expects.

location /auth/v1/ {
    default_type application/json;
    if ($omni_key_ok = 0) {
        return 401 '{"message":"Invalid API key"}';
    }
    set $omni_upstream auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass http://$omni_upstream;
    include /etc/nginx/omni/proxy-common.conf;
    proxy_set_header Authorization $omni_authorization;
}

# PostgREST root would list the API surface; nobody needs it.
location = /rest/v1/ {
    return 404;
}

location /rest/v1/ {
    default_type application/json;
    if ($omni_key_ok = 0) {
        return 401 '{"message":"Invalid API key"}';
    }
    set $omni_upstream rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://$omni_upstream;
    include /etc/nginx/omni/proxy-common.conf;
    proxy_set_header Authorization $omni_authorization;
}

# Realtime derives its tenant from the Host header's first label, so these
# two locations set Host explicitly instead of including proxy-common.conf.
location /realtime/v1/api/ {
    default_type application/json;
    if ($omni_key_ok = 0) {
        return 401 '{"message":"Invalid API key"}';
    }
    set $omni_upstream realtime-dev.supabase-realtime:4000;
    rewrite ^/realtime/v1/api/(.*)$ /api/$1 break;
    proxy_pass http://$omni_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $omni_authorization;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}

location /realtime/v1/ {
    default_type application/json;
    if ($omni_key_ok = 0) {
        return 401 '{"message":"Invalid API key"}';
    }
    set $omni_upstream realtime-dev.supabase-realtime:4000;
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass http://$omni_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $omni_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $omni_connection_upgrade;
    proxy_connect_timeout 3s;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
